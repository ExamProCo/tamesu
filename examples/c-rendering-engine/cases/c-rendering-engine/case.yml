schema_version: 1
name: c-rendering-engine
title: One-shot C Rendering Engine
description: >
  Compare three Muse Spark model versions on the same one-shot request to build a
  software rendering engine from scratch in C, ending in a visually striking lighting
  demonstration.
business_use: >
  The result will help identify which Muse Spark version is the strongest candidate for
  generating substantial, self-contained systems-programming prototypes in one turn.
current_problem: >
  A short prompt asks for a broad implementation spanning pixel output, primitives,
  scene complexity, and lighting, so responses may be incomplete, unbuildable, or stop
  at an explanation instead of delivering a runnable project.
technical_uncertainty: >
  We do not know how Muse Spark 1.3, 1.2, and 1.1 differ in completeness, buildability,
  rendering architecture, scene complexity, lighting quality, and reproducibility when
  each receives exactly one identical request.
default_task: structured_text
