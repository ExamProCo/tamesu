name: executable
question: >
  Which Muse Spark version produces a C renderer that builds, runs, and produces a
  decodable image from one identical request?
description: >
  Executable follow-up to single-shot. Each model's response is compiled and run in a
  network-less Docker sandbox through Inspect AI; Tamesu freezes the plan and the dataset,
  and ingests the compiler log, run log, source files, and rendered PNG as run evidence.

task: artifact_bundle
dataset: ../../../../datasets/rendering-engine-prompt-v1/dataset.yml

execution:
  backend: inspect
  file: ../../inspect/task.py
  task: rendering_engine
  limits:
    cost_limit: 0.25
    time_limit: 600
    token_limit: 60000
  artifacts:
    required: [source, compiler-log, run-log, render]
    allowed: [response]
    review: render

defaults:
  repetitions: 1
  concurrency: 1
  timeout_seconds: 300
  retries: 3
  budget_usd: 1.00
  parameters:
    effort: low
    max_tokens: 16000

arms:
  - id: file-blocks
    description: >
      The supplied rendering-engine request, unchanged, with a system instruction that fixes
      the file layout and build command so the response can be compiled mechanically.
    prompts:
      system: ../../prompts/system-files.md
      user: ../../prompts/user.md.j2

runs:
  - model: muse-spark-1.3
    provider: meta
    arms: [file-blocks]
  - model: muse-spark-1.2
    provider: meta
    arms: [file-blocks]
  - model: muse-spark-1.1
    provider: meta
    arms: [file-blocks]

evaluation:
  mechanical:
    - compiles_and_renders:
        pass_at: 1.0          # all five deterministic steps must pass
  human_review:
    rubric: ../../rubrics/rendering-engine-visual.yml
  acceptance:
    requires: [mechanical, human]
    human:
      required_reviews_per_item: 1
      on_disagreement: adjudicate
    selection: none

metrics:
  primary: mean_score:compiles_and_renders
  secondary:
    - full_credit_rate:compiles_and_renders
    - render_rate
    - mechanical_pass_rate
    - accepted_rate
    - human_pass_rate_given_artifact
    - review_completion_rate
    - artifact_complete_rate
    - completion_rate
    - median_latency_ms
    - mean_total_tokens
