schema_version: 1
name: two-model-baseline
status: active
question: >
  What share of generated images are usable fictional product references, and does a model
  judge agree with a human reviewer?
description: >
  Generate one image per product with two image models using the same prompt, size, and
  format. Mechanical checks run at generation; a model judge screens; a human review decides.

task: image_generation
dataset: ../../../../datasets/products-v1/dataset.yml

defaults:
  repetitions: 1
  concurrency: 2
  timeout_seconds: 180
  retries: 1
  budget_usd: 2.00
  judge_budget_usd: 0.50
  parameters:
    image:
      size: 1024x1024
      output_format: png

arms:
  - id: studio-reference
    description: One product on a plain background, front three-quarter view, invented branding only.
    prompts:
      prompt: ../../prompts/generate.md

runs:
  - model: muse-image-1.0
    provider: meta
    arms:
      - studio-reference
    parameters:
      provider_options:
        reasoning_strength: low
        tool_enablement:
          enable_image_search: false
          enable_web_search: false
          enable_shell: false

  - model: gpt-image-2
    provider: openai
    arms:
      - studio-reference
    parameters:
      provider_options:
        quality: low

evaluation:
  mechanical:
    - decodable_image
    - min_resolution: {width: 512, height: 512, prerequisite: true}
    - format_match
    - non_uniform
  model_judges:
    - id: vision-judge-1
      provider: meta
      model: muse-spark-1.3
      rubric: ../../rubrics/product-reference-quality.yml
      prompts:
        system: ../../prompts/judge-system.md
        user: ../../prompts/judge-user.md
      repetitions: 1
      parameters:
        effort: low
        max_tokens: 2000
  human_review:
    rubric: ../../rubrics/product-reference-quality.yml
  acceptance:
    requires: [mechanical, human]
    human:
      required_reviews_per_item: 1
      on_disagreement: adjudicate
    model_judge:
      role: screen
    selection: none

metrics:
  primary: product_reference_pass_rate
  secondary:
    - generation_success_rate
    - safety_filter_rate
    - invalid_artifact_rate
    - mechanical_pass_rate_given_image
    - model_judge_pass_rate_given_image
    - human_pass_rate_given_image
    - review_completion_rate
    - cost_per_accepted_usd
